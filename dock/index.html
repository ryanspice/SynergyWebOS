<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynergyWebOS Dock</title><link rel="stylesheet" href="dock.css"></head>
<body><main class="stage"><header><span class="eyebrow">SYNERGYWEBOS DOCK / APP SWITCHER</span><h1>Your apps, within reach.</h1><p>Choose an app to open or return to it. Move to the bottom edge to reveal the dock.</p></header><section class="help"><h2>At a glance</h2><p><kbd>Tab</kbd> navigate <kbd>Enter</kbd> open <kbd>Esc</kbd> hide <kbd>D</kbd> show</p><p id="status" role="status" aria-live="polite">Connecting to TV services…</p><button id="refresh" type="button">Refresh apps</button></section></main><div id="edge" aria-hidden="true"></div><nav id="dock" aria-label="App switcher"><div class="dock-head"><div><strong>Apps</strong><span id="mode">Loading</span></div><button id="hide" type="button" aria-label="Hide dock">Hide</button></div><div id="apps" class="apps"></div><p id="empty" hidden>No apps available. Check TV service access and refresh.</p></nav><script src="catalog.js"></script><script src="dock.js"></script></body></html>
