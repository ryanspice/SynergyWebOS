# Keeps declared dependencies and CI actions current without pushing changes
# from this environment. Dependabot only opens PRs; the maintainer merges.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/app"
      - "/dock"
      - "/scripts/build"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      runtime-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
