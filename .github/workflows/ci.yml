# Repository CI for synergy-tv.
#
# Jobs:
#   1. repo-guards  — always runs; no dependency install. Repository hygiene
#                     (no secrets/backups/proprietary files) and docs links.
#   2. detect-build — reports whether a build entry point exists yet.
#   3. build-test   — legacy web 0.3.4 build/package + suite on Windows. It is
#                     migration source, not the native 0.4.0 artifact.
#   4. native       — native C++20 Release + CTest and ASan/UBSan on Linux.
#
# Live TV/PC checks are NOT part of CI. They require a rooted TV and the live
# Synergy server and are recorded as maintainer acceptance (docs/testing.md).
#
# All workstream folders are committed, so documentation links are mandatory;
# CI runs the same build and full test runner used by the maintainer.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-guards:
    name: Repo hygiene + docs links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Guard against committed secrets, backups and proprietary bundles
        shell: pwsh
        run: ./scripts/check-repo-guards.ps1

      - name: Check documentation links
        shell: pwsh
        run: ./scripts/check-docs-links.ps1

  detect-build:
    name: Detect build pipeline
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect build entry point
        id: detect
        shell: pwsh
        run: |
          $hasScript = Test-Path './scripts/build/build.ps1'
          $hasNode = (Test-Path './package.json') -and
                      ((Test-Path './package-lock.json') -or (Test-Path './pnpm-lock.yaml') -or (Test-Path './yarn.lock'))
          if ($hasScript -or $hasNode) {
            "present=true" >> $env:GITHUB_OUTPUT
            Write-Host "Build entry point found."
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "No build entry point yet (scaffolding stage); build-test will be skipped."
          }

  build-test:
    name: Legacy web build + test
    needs: detect-build
    if: needs.detect-build.outputs.present == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install webOS CLI for packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .ares -Force | Out-Null
          npm install --prefix .ares --no-save --no-package-lock @webos-tools/cli@3.2.6
          "ARES_CLI_DIR=$((Resolve-Path .ares).Path)" >> $env:GITHUB_ENV

      - name: Install dependencies (if declared)
        shell: pwsh
        run: |
          if (Test-Path './package-lock.json') {
            npm ci
          } else {
            Write-Host "No package-lock.json; no dependency install."
          }

      - name: Build
        shell: pwsh
        run: ./scripts/build/build.ps1

      - name: Test
        shell: pwsh
        run: ./tests/lib/Run-Tests.ps1

  native:
    name: Native 0.4.0 (Linux host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 \
            libsdl2-dev libfreetype6-dev libjson-c-dev libpng-dev

      - name: Configure Release
        run: cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSYNERGY_STRICT=ON

      - name: Build Release
        run: cmake --build native/build/ci --parallel 4

      - name: Test Release
        run: ctest --test-dir native/build/ci --output-on-failure

      - name: Configure ASan/UBSan
        run: cmake -S native -B native/build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSYNERGY_STRICT=ON -DSYNERGY_SANITIZE=ON -DSYNERGY_BUILD_UI=OFF

      - name: Build ASan/UBSan
        run: cmake --build native/build/asan --parallel 4

      - name: Test ASan/UBSan
        run: ctest --test-dir native/build/asan --output-on-failure
